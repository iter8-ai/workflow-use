name: Agent setup
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recording
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: uv sync --frozen --group dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run pytest
