# no-mistakes gate for workflow-use. Read only from the trusted default branch (main),
# so edits apply to later runs.
commands:
  prepare: "scripts/gate-test.sh prepare"
  test: "scripts/gate-test.sh test"
  lint: "scripts/gate-test.sh lint"

test:
  instructions: |
    commands.test (scripts/gate-test.sh test) is the validation for this repository. It runs the
    recording service tests (recording/) when that area changes. Never install Playwright
    browsers. Live provider runs (Browserbase, the deployed recorder) and staging E2E happen
    outside the gate; report those scenarios untested with that reason. The agent setup wizard
    lives in commercials-flow-editor, a separate repository; do not check it out here.
