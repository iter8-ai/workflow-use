[project]
name = "workflow-use-recording"
version = "0.1.0"
description = "Ephemeral browser demonstration capture service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "browserbase>=1.0.3,<2",
    "fastapi>=0.115,<1",
    "playwright>=1.45,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_use_recording"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "I", "PLE"]
